[build]
  command = "npm run build"
  publish = ".next"

# ── Redirects ────────────────────────────────────────────────────────────────
# Collapse http://valexity.com → https://valexity.com → https://www.valexity.com
# into a single 301 hop (flagged in the GEO audit). Netlify applies HTTPS itself,
# so these cover the apex domain on both schemes.
[[redirects]]
  from = "http://valexity.com/*"
  to = "https://www.valexity.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://valexity.com/*"
  to = "https://www.valexity.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.valexity.com/*"
  to = "https://www.valexity.com/:splat"
  status = 301
  force = true

# The old /referral canonical pointed here and returned 404.
[[redirects]]
  from = "/referral-program"
  to = "/referral"
  status = 301

# Website design and development were merged into one page.
[[redirects]]
  from = "/website-design-services"
  to = "/website-development-services"
  status = 301
  force = true

# ── Security headers ─────────────────────────────────────────────────────────
# The audit found only 2 of 6 recommended headers. If you add analytics or a chat
# widget (GA4, Pagesense, Apollo, Chatbase), add their domains to script-src,
# connect-src, img-src and frame-src below.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.emailjs.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
